<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translate('detect_plant') }} - {{ translate('title') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/">{{ translate('title') }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">{{ translate('home') }}</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">{{ translate('detect_plant') }}</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard">{{ translate('dashboard') }}</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown">
                            Language
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/set_language/en">English</a></li>
                            <li><a class="dropdown-item" href="/set_language/hi">हिंदी</a></li>
                            <li><a class="dropdown-item" href="/set_language/kn">ಕನ್ನಡ</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/login">{{ translate('admin_login') }}</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">{{ translate('detect_plant') }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file" class="form-label">{{ translate('upload_image') }}</label>
                                <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-success">{{ translate('detect_disease') }}</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>{{ translate('copyright') }}</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
